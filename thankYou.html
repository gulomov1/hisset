<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#96005f" />
    <title>Buyurtma holati — Hisset</title>
    <meta name="description" content="Hisset buyurtmangizni yuborish holati." />
    <style>
*{margin:0;padding:0;box-sizing:border-box}html{-webkit-text-size-adjust:100%}body{min-height:100vh;background:#fff;color:#171717;font-family:Arial,-apple-system,"Segoe UI",Roboto,system-ui,sans-serif;-webkit-font-smoothing:antialiased}.thanks{max-width:390px;margin-inline:auto;padding:0 22px 40px;text-align:center}.thanks_brand{width:133px;height:90px;margin:0 auto 50px;border-radius:0 0 17px 17px;background:#96005f url(./assets/hisset-logo.avif) center/54px auto no-repeat}.thanks_title{font-family:serif;font-size:30px;line-height:1.16;text-transform:uppercase;color:#c7007e}.thanks_text{margin-top:20px;font-size:16px;line-height:1.5;color:#717171}.thanks_error{margin-top:20px;padding:14px;border:1px solid #ff35b7;border-radius:12px;font-size:15px;line-height:1.5;color:#96005f}.thanks_btn{display:flex;align-items:center;justify-content:center;min-height:56px;margin-top:28px;padding:12px;border-radius:12px;background:linear-gradient(90deg,#c7007e,#ee0097,#c7007e);box-shadow:0 3px 0 #96005f;color:#fff;font-size:16px;font-weight:700;text-transform:uppercase;text-decoration:none}.thanks_btn:focus-visible{outline:3px solid #96005f;outline-offset:4px}
    </style>
  </head>
  <body>
    <main class="thanks">
      <div class="thanks_brand" role="img" aria-label="Hisset"></div>
      <h1 class="thanks_title" id="orderStatus" aria-live="polite">Buyurtma holati</h1>
      <p class="thanks_text" id="orderDescription">Buyurtmangiz holati tekshirilmoqda.</p>
      <p class="thanks_error" id="errorMessage" role="alert" style="display:none">Buyurtma yuborilmadi. Sahifani yangilab, qaytadan urinib koʻring.</p>
      <a class="thanks_btn" href="./">Kolleksiyaga qaytish</a>
      <noscript><p class="thanks_error">Buyurtmani yuborish uchun brauzeringizda JavaScriptʼni yoqing.</p></noscript>
    </main>
    <script defer src="./js/thankYou.js"></script>
  </body>
</html>
